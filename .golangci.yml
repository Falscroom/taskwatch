version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Запись в stdout/tabwriter и закрытие тела ответа: ошибку тут некуда деть.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*text/tabwriter.Writer).Flush
  exclusions:
    rules:
      # cgo-константы Security.framework gocritic видит как одинаковые выражения.
      - path: internal/platform/keychain/
        linters: [gocritic]
        text: dupSubExpr

formatters:
  enable:
    - gofmt
